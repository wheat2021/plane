  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
      args:
        DOCKER_BUILDKIT: 1
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple/}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
    restart: unless-stopped
    networks:
      - dev_env
    volumes:
      - ./apps/api:/code
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
      DEBUG: 1
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3100"
      POSTGRES_HOST: plane-db
      POSTGRES_PORT: 5432
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@plane-db:5432/${POSTGRES_DB}"
      REDIS_HOST: plane-redis
      REDIS_PORT: 6379
      REDIS_URL: "redis://plane-redis:6379/"
      RABBITMQ_HOST: plane-mq
      RABBITMQ_PORT: 5672
      AMQP_URL: "amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@plane-mq:5672/${RABBITMQ_VHOST}"
      USE_MINIO: 1
      SIGNED_URL_EXPIRATION: 3600
      GUNICORN_WORKERS: 2
      HARD_DELETE_AFTER_DAYS: 60
      FILE_SIZE_LIMIT: 5242880
      API_KEY_RATE_LIMIT: "60/minute"
      WEB_URL: "http://localhost:3000"
      APP_BASE_URL: "http://localhost:3000"
      APP_BASE_PATH: ""
      ADMIN_BASE_URL: "http://localhost:3001"
      ADMIN_BASE_PATH: "/god-mode"
      SPACE_BASE_URL: "http://localhost:3002"
      SPACE_BASE_PATH: "/spaces"
      LIVE_BASE_URL: "http://localhost:3100"
      LIVE_BASE_PATH: "/live"
      API_BASE_URL: "http://localhost:8000"
      ENABLE_DRF_SPECTACULAR: 1
    command: ./bin/docker-entrypoint-api-local.sh
    depends_on:
      - plane-db
      - plane-redis
      - plane-mq
    ports:
      - "8000:8000"

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
      args:
        DOCKER_BUILDKIT: 1
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple/}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
    restart: unless-stopped
    networks:
      - dev_env
    volumes:
      - ./apps/api:/code
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
      DEBUG: 1
      POSTGRES_HOST: plane-db
      POSTGRES_PORT: 5432
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@plane-db:5432/${POSTGRES_DB}"
      REDIS_HOST: plane-redis
      REDIS_PORT: 6379
      REDIS_URL: "redis://plane-redis:6379/"
      RABBITMQ_HOST: plane-mq
      RABBITMQ_PORT: 5672
      AMQP_URL: "amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@plane-mq:5672/${RABBITMQ_VHOST}"
      USE_MINIO: 1
      SIGNED_URL_EXPIRATION: 3600
      HARD_DELETE_AFTER_DAYS: 60
      FILE_SIZE_LIMIT: 5242880
    command: ./bin/docker-entrypoint-worker.sh
    depends_on:
      - api
      - plane-db
      - plane-redis

  beat-worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
      args:
        DOCKER_BUILDKIT: 1
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple/}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
    restart: unless-stopped
    networks:
      - dev_env
    volumes:
      - ./apps/api:/code
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
      DEBUG: 1
      POSTGRES_HOST: plane-db
      POSTGRES_PORT: 5432
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@plane-db:5432/${POSTGRES_DB}"
      REDIS_HOST: plane-redis
      REDIS_PORT: 6379
      REDIS_URL: "redis://plane-redis:6379/"
      RABBITMQ_HOST: plane-mq
      RABBITMQ_PORT: 5672
      AMQP_URL: "amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@plane-mq:5672/${RABBITMQ_VHOST}"
      USE_MINIO: 1
    command: ./bin/docker-entrypoint-beat.sh
    depends_on:
      - api
      - plane-db
      - plane-redis

  migrator:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
      args:
        DOCKER_BUILDKIT: 1
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple/}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
    restart: "no"
    networks:
      - dev_env
    volumes:
      - ./apps/api:/code
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
      POSTGRES_HOST: plane-db
      POSTGRES_PORT: 5432
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@plane-db:5432/${POSTGRES_DB}"
      REDIS_HOST: plane-redis
      REDIS_PORT: 6379
      REDIS_URL: "redis://plane-redis:6379/"
    command: ./bin/docker-entrypoint-migrator.sh --settings=plane.settings.local
    depends_on:
      - plane-db
      - plane-redis

  # proxy:
