{% extends "admin/change_form.html" %}

{% block object-tools-items %}
  {% if reset_password_url %}
  <li>
    <a
      href="{{ reset_password_url }}"
      class="historylink"
      onclick="return confirm('确定要将该用户密码重置为工号？重置后用户登录时需修改密码。')"
    >重置密码为工号</a>
  </li>
  {% endif %}
  {{ block.super }}
{% endblock %}
